<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07112A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lapland">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307112A'/%3E%3Cpath d='M6 44c10-18 18-26 30-26s16 10 22 6' fill='none' stroke='%237DF5C3' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M6 54c10-10 20-14 30-14s14 6 22 2' fill='none' stroke='%2386D9FF' stroke-width='4' stroke-linecap='round' opacity='.8'/%3E%3Ccircle cx='16' cy='14' r='2' fill='%23fff'/%3E%3Ccircle cx='46' cy='10' r='1.6' fill='%23fff'/%3E%3C/svg%3E">
<title>Aurora Lapland Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: phone-first single column (max 760px). Night-sky header with live aurora,
   a scrolling day strip, card sections per day, and a fixed bottom tab bar. */
:root{
  --bg:#EEF4FA; --bg2:#E2ECF6; --card:#FFFFFF; --card2:#F5F9FD; --fg:#0F1F3D; --muted:#4D6187; --line:#D3DFEC;
  --aurora:#0C9A6A; --aurora2:#1A78B8; --violet:#6A4ED6; --gold:#A86F00; --gold-soft:#FFF1D2; --berry:#CF3446;
  --good:#0C9A6A; --warn:#B76E00; --bad:#CF3446;
  --land:#E3ECE4; --land-line:#9DB2A6; --water:#C6DCEE; --route:#CF3446; --rail:#6A4ED6; --flight:#1A78B8;
  --sky1:#07112A; --sky2:#10244F; --sky-fg:#EEF5FF; --sky-muted:#A9BCE0;
  --shadow:0 1px 2px rgba(15,31,61,.06),0 6px 18px rgba(15,31,61,.07);
  --f-display:"Fredoka","Nunito Sans",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1430; --bg2:#0F1C40; --card:#13244C; --card2:#182C5A; --fg:#EAF1FF; --muted:#9FB2D8; --line:#24396B;
  --aurora:#5EF0B2; --aurora2:#7CD3FF; --violet:#B7A0FF; --gold:#FFC95E; --gold-soft:#3A3220; --berry:#FF7484;
  --good:#5EF0B2; --warn:#FFC95E; --bad:#FF7484;
  --land:#1B2F5C; --land-line:#38528A; --water:#0C1836; --route:#FF7484; --rail:#B7A0FF; --flight:#7CD3FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1430; --bg2:#0F1C40; --card:#13244C; --card2:#182C5A; --fg:#EAF1FF; --muted:#9FB2D8; --line:#24396B;
  --aurora:#5EF0B2; --aurora2:#7CD3FF; --violet:#B7A0FF; --gold:#FFC95E; --gold-soft:#3A3220; --berry:#FF7484;
  --good:#5EF0B2; --warn:#FFC95E; --bad:#FF7484;
  --land:#1B2F5C; --land-line:#38528A; --water:#0C1836; --route:#FF7484; --rail:#B7A0FF; --flight:#7CD3FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sky1)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
a{color:var(--aurora2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--aurora2);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Sky header ---------- */
.sky{position:relative;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--sky-fg);overflow:hidden}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky .wrap{position:relative;padding-block:18px 14px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky-muted);font-weight:700}
.brand{font-size:clamp(24px,6vw,32px);font-weight:700;letter-spacing:.005em;margin-top:2px}
.brand em{font-style:normal;background:linear-gradient(90deg,#7DF5C3,#86D9FF 55%,#C5A8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.clocks{text-align:right;font-size:12px;color:var(--sky-muted);white-space:nowrap}
.clocks b{display:block;font-family:var(--f-mono);font-size:19px;color:var(--sky-fg);font-weight:700}
.status{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-weight:700;font-size:12.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:var(--sky-fg)}
.pill.glow{background:rgba(125,245,195,.16);border-color:rgba(125,245,195,.45);color:#B9FFE2}
.lights{position:relative;height:10px;margin-top:12px}
.lights i{position:absolute;top:0;width:7px;height:9px;border-radius:50% 50% 45% 45%;filter:drop-shadow(0 0 5px currentColor)}

/* ---------- Day strip ---------- */
.strip-band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sky2);border-bottom:1px solid rgba(255,255,255,.08)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:9px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:center;min-width:52px;text-align:center;border-radius:14px;padding:6px 8px 5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--sky-muted);cursor:pointer;line-height:1.15}
.dchip .dn{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--sky-fg)}
.dchip .dd{font-size:10.5px;letter-spacing:.04em}
.dchip .dot{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:transparent}
.dchip.hunt .dot{background:#7DF5C3;box-shadow:0 0 6px #7DF5C3}
.dchip.on{background:linear-gradient(160deg,#7DF5C3,#86D9FF);color:#08203A;border-color:transparent}
.dchip.on .dn{color:#06182E}
.dchip.on .dot{background:#06182E;box-shadow:none}
.dchip.today:not(.on){border-color:#FFC95E;color:#FFE3A6}
.dchip.past:not(.on){opacity:.6}

/* ---------- Sections ---------- */
main{padding-block:16px 8px}
.view{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:19px;display:flex;align-items:center;gap:8px}
.card h2 .ic{width:22px;height:22px;flex:0 0 22px;color:var(--aurora)}
.sub{color:var(--muted);font-size:13px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.tag.aur{color:var(--aurora);border-color:color-mix(in srgb,var(--aurora) 45%,transparent);background:color-mix(in srgb,var(--aurora) 10%,transparent)}
.tag.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-soft)}

/* Day hero */
.hero{position:relative;overflow:hidden;padding:18px}
.hero .kicker{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.hero h1{font-size:clamp(25px,6.4vw,34px);margin:6px 0 8px}
.hero p{margin:0 0 12px;max-width:62ch}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:13px}
.route span.arrow{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.fact{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-width:0}
.fact .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.fact .v{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;font-size:13.5px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.banner b{color:var(--gold)}

/* Map */
.mapbox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--water);aspect-ratio:4/3.1;max-width:100%;touch-action:none}
.mapbox canvas{display:block;width:100%;height:100%;cursor:grab}
.mapctl{position:absolute;right:8px;top:8px;display:grid;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-weight:800;font-size:17px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.stops{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:2px}
.stops li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.stops li:first-child{border-top:0}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--route);color:#fff}
.num.hotel{background:var(--gold);color:#1B1300}
.num.air{background:var(--flight);color:#04162B}
.stops .nm{font-weight:700;min-width:0}
.stops .nt{font-size:12.5px;color:var(--muted)}
.go{font-size:12.5px;font-weight:800;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;color:var(--aurora2)}

/* Weather */
.wx-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.wx-ico{width:68px;height:68px;color:var(--aurora2)}
.wx-big{font-family:var(--f-display);font-size:46px;font-weight:600;line-height:1}
.wx-big small{font-size:18px;color:var(--muted);font-weight:500}
.wx-cond{font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
@media (max-width:460px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.metric{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.metric .v{font-family:var(--f-mono);font-weight:700;font-size:18px}
.metric .v small{font-size:12px;color:var(--muted);font-weight:500}
.chart{margin-top:14px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.daylight{margin-top:12px}
.dl-bar{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--sky1),var(--sky2));overflow:hidden;border:1px solid var(--line)}
.dl-bar span{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#FFB65C,#FFE08A,#FFB65C);border-radius:999px}
.dl-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px;gap:8px;flex-wrap:wrap}
.src{font-size:11.5px;color:var(--muted);margin-top:10px}

/* Wear */
.wear-head{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tier{font-family:var(--f-display);font-weight:600;font-size:17px}
.thermo{display:flex;gap:3px}
.thermo i{width:14px;height:8px;border-radius:3px;background:var(--line)}
.layers{display:grid;gap:8px}
.layer{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.layer:first-child{border-top:0}
.layer .z{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding-top:2px}
.layer .w{font-weight:600}
.extras{margin-top:12px;display:grid;gap:6px}
.extra{display:flex;gap:8px;font-size:13.5px;align-items:flex-start}
.extra::before{content:"";flex:0 0 7px;height:7px;margin-top:7px;border-radius:50%;background:var(--gold)}

/* Aurora */
.aur-grid{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
@media (max-width:420px){.aur-grid{grid-template-columns:1fr}}
.gauge{position:relative;width:120px;height:120px}
.gauge svg{width:100%;height:100%}
.gauge .g-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .g-txt b{font-family:var(--f-display);font-size:22px}
.gauge .g-txt span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.bars{display:grid;gap:9px}
.bar-row .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.bar-row .lbl span{color:var(--muted);font-weight:600}
.track{height:9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.track span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--aurora),var(--aurora2))}
.hours{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.hr{flex:1 0 34px;text-align:center;font-size:11px;color:var(--muted)}
.hr i{display:block;height:26px;border-radius:7px;margin-bottom:3px;border:1px solid var(--line)}

/* Plan / tips */
.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .t{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--aurora2);padding-top:1px}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px}
.tips li svg{width:20px;height:20px;color:var(--gold);margin-top:1px}
textarea{width:100%;min-height:96px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);padding:10px 12px;font:inherit}
.saved{font-size:12px;color:var(--muted);min-height:18px;margin-top:4px}

/* Flights */
.pass{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:14px 0;border-top:1px dashed var(--line)}
.pass:first-of-type{border-top:0}
.pass .ap{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.pass .city{font-size:12.5px;color:var(--muted)}
.pass .tm{font-family:var(--f-mono);font-weight:700;font-size:16px;margin-top:4px}
.pass .mid{text-align:center;font-size:12px;color:var(--muted)}
.pass .mid svg{width:56px;height:20px;color:var(--flight);display:block;margin:2px auto}
.pass .r{text-align:right}
.flt-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;font-size:12.5px}
.count{font-family:var(--f-display);font-size:30px;font-weight:600}

/* Packing */
.prog{display:flex;align-items:center;gap:14px}
.prog .ring{width:64px;height:64px}
.pk-group{margin-top:6px}
.pk-group h3{font-size:15px;margin:14px 0 6px;color:var(--muted);font-family:var(--f-body);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.pk{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.pk input{width:20px;height:20px;accent-color:var(--aurora);flex:0 0 20px}
.pk.done span{text-decoration:line-through;color:var(--muted)}

/* Toolkit */
.conv{display:grid;grid-template-columns:1fr auto;gap:8px}
.conv input,.conv select{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);min-width:0}
.conv-out{margin-top:10px;font-family:var(--f-display);font-size:28px;font-weight:600}
.ref{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ref div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px}
.ref b{display:block;font-family:var(--f-mono);font-size:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
th,td{text-align:left;padding:8px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:0}
.kv{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
.big112{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--berry);line-height:1}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:grid;justify-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:800}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--aurora)}
.theme-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--sky-fg);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.foot{color:var(--muted);font-size:12px;text-align:center;padding-block:10px 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="sky" id="sky">
  <canvas id="auroraCv" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="eyebrow">21 Nov – 3 Dec 2026 · NO · SE · FI</div>
        <div class="brand">Winter <em>Aurora</em> Lapland</div>
      </div>
      <div class="clocks">
        <span id="clkLabel">Local</span><b id="clkLocal">--:--</b>
        <span>Singapore <span class="mono" id="clkSg">--:--</span></span>
      </div>
    </div>
    <div class="status" id="status"></div>
    <div class="lights" id="lights" aria-hidden="true"></div>
  </div>
</header>
<div class="strip-band"><div class="wrap"><nav class="strip" id="strip" aria-label="Trip days"></nav></div></div>

<main class="wrap"><div id="view" class="view"></div>
  <p class="foot">Itinerary: L.G.E planner (times as printed, confirm with Finnair). Forecast: Open-Meteo · Aurora: NOAA SWPC · Map: Natural Earth.</p>

function wmo(code, night){
  const c = code ?? -1;
  if(c===0) return [night?"moon":"sun", night?"Clear night":"Clear sky"];
  if(c===1) return [night?"moon":"partly","Mainly clear"];
  if(c===2) return ["partly","Partly cloudy"];
  if(c===3) return ["cloud","Overcast"];
  if(c===45||c===48) return ["fog","Fog"];
  if(c>=51&&c<=55) return ["rain","Drizzle"];
  if(c===56||c===57) return ["sleet","Freezing drizzle"];
  if(c>=61&&c<=65) return ["rain",c===65?"Heavy rain":"Rain"];
  if(c===66||c===67) return ["sleet","Freezing rain"];
  if(c>=71&&c<=75) return ["snow",c===75?"Heavy snow":"Snow"];
  if(c===77) return ["snow","Snow grains"];
  if(c>=80&&c<=82) return ["rain","Rain showers"];
  if(c===85||c===86) return ["snow","Snow showers"];
  if(c>=95) return ["storm","Thunderstorm"];
  return ["cloud","No forecast yet"];
}
const isWetCode = c => (c>=51&&c<=67)||(c>=80&&c<=82);
const isSnowCode = c => (c>=71&&c<=77)||c===85||c===86;

const POINTS = {sin:[1.3644,103.9915],hel:[60.1699,24.9384],tro:[69.6492,18.9553],svo:[68.2342,14.5683],rei:[67.9325,13.0889],

const HOURLY = ["temperature_2m","relative_humidity_2m","apparent_temperature","precipitation_probability","precipitation","snowfall","weather_code","cloud_cover","wind_speed_10m","wind_gusts_10m"];
const DAILY = ["sunrise","sunset","daylight_duration","temperature_2m_max","temperature_2m_min","apparent_temperature_max","apparent_temperature_min","weather_code","precipitation_probability_max","wind_speed_10m_max"];
async function getT(url, asText){
  const ac = new AbortController(), tm = setTimeout(()=>ac.abort(), 15000);
  try{ const r = await fetch(url, {signal:ac.signal}); if(!r.ok) throw new Error(r.status); return asText ? r.text() : r.json(); }
  finally{ clearTimeout(tm); }
}
async function fetchLive(){
  if(typeof navigator!=="undefined" && navigator.onLine===false) return null;
  const keys = Object.keys(POINTS);
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + keys.map(k=>POINTS[k][0]).join(",") +
    "&longitude=" + keys.map(k=>POINTS[k][1]).join(",") + "&hourly=" + HOURLY.join(",") + "&daily=" + DAILY.join(",") +
    "&timezone=auto&forecast_days=16&wind_speed_unit=kmh";
  let res = await getT(url); if(!Array.isArray(res)) res=[res];
  const weather = {};
  keys.forEach((k,n)=>{
    const r = res[n], days = {}, dd = r.daily, h = r.hourly;
    dd.time.forEach((d,i)=>{
      if(d < DAYS[0].date || d > DAYS[12].date) return;
      const day = {}; DAILY.forEach(v=>day[v]=dd[v][i]);
      day.sunrise = day.sunrise ? day.sunrise.slice(11,16) : null; day.sunset = day.sunset ? day.sunset.slice(11,16) : null;
      const idx = []; h.time.forEach((t,j)=>{ if(t.startsWith(d)) idx.push(j); });
      day.hourly = {}; HOURLY.forEach(v=>day.hourly[v]=idx.map(j=>h[v][j]));
      days[d] = day;
    });
    weather[k] = {tz:r.timezone, days};
  });
  const out = Object.assign({}, DATA||{}, {weather, updated:new Date().toISOString().slice(0,16)+"Z", live:true});
  try{
    const txt = await getT("https://services.swpc.noaa.gov/text/27-day-outlook.txt", true);
    const kp = {}, M = {Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
    for(const m of txt.matchAll(/^(\d{4}) (\w{3}) (\d{2})\s+(\d+)\s+(\d+)\s+(\d+)/gm)) kp[`${m[1]}-${M[m[2]]}-${m[3]}`] = +m[6];
    const iss = txt.match(/:Issued: (.+)/);
    if(Object.keys(kp).length) out.aurora = {issued: iss ? iss[1].trim() : null, kp: Object.assign({}, (DATA&&DATA.aurora&&DATA.aurora.kp)||{}, kp)};
  }catch(e){}
  try{ const f = await getT("https://api.frankfurter.dev/v1/latest?base=SGD&symbols=EUR,NOK,SEK"); out.fx = {date:f.date, perSGD:f.rates}; }catch(e){}
  return out;
}

function tripDayIndexNow(){
  for(let i=0;i<DAYS.length;i++){ if(dateIn(dayTz(DAYS[i])) === DAYS[i].date) return i; }
  const today = dateIn(TZ.FI);
  if(today < DAYS[0].date) return -1;      // before the trip
  if(today > DAYS[12].date) return 99;     // after
  return DAYS.findIndex(d => d.date >= today);
}
let state = {tab:"day", day:0, wxLoc:{}, wearMode:"day"};
function route(){
  const h = location.hash.replace("#","");
  const m = h.match(/^day-(\d{1,2})$/);
  if(m){ state.tab="day"; state.day = Math.min(12, Math.max(0, +m[1]-1)); }
  else if(h==="flights"||h==="pack"||h==="kit"){ state.tab=h; }
  else { state.tab="day"; const t = tripDayIndexNow(); state.day = t<0?0:t>12?12:t; }
  render(); window.scrollTo({top:0});
}

/* ================= Weather extraction ================= */
function wxFor(key, date){
  const w = DATA && DATA.weather && DATA.weather[key];
  const d = w && w.days && w.days[date];
  return d ? Object.assign({tz:w.tz}, d) : null;
}
function windowStats(d, from, to){
  const H = d.hourly, idx=[]; for(let h=from; h<=to; h++) if(h>=0&&h<24) idx.push(h);
  const pick = k => idx.map(i=>H[k][i]);
  return {
    feelsMin: mn(pick("apparent_temperature")), feelsMax: mx(pick("apparent_temperature")),
    tMin: mn(pick("temperature_2m")), tMax: mx(pick("temperature_2m")),
    hum: avg(pick("relative_humidity_2m")), wind: mx(pick("wind_speed_10m")), gust: mx(pick("wind_gusts_10m")),
    pop: mx(pick("precipitation_probability")), snow: pick("snowfall").reduce((a,b)=>a+(b||0),0),
    cloud: avg(pick("cloud_cover")), wet: pick("weather_code").some(isWetCode), snowy: pick("weather_code").some(isSnowCode)
  };
}
function dayWindow(d){
  const sr = minutes(d.sunrise), ss = minutes(d.sunset);
  if(sr==null||ss==null||ss-sr<60) return [9,16];
  return [Math.max(7,Math.floor(sr/60)-1), Math.min(18,Math.ceil(ss/60)+2)];
}

/* ================= What to wear ================= */
function wearAdvice(s, acts, night){
  const f = s.feelsMin, wind = s.wind||0, wet = s.wet || (s.pop>=50 && s.tMax>0), snow = s.snowy || s.snow>0.2;
  const icy = s.tMin!=null && s.tMin<=1 && s.tMax>=-3;
  let tier, lvl, L;
  if(f>=22){ tier="Tropical"; lvl=0; L={Top:"Breathable T-shirt or linen shirt", Bottom:"Light trousers, shorts or skirt", Feet:"Sandals or sneakers", Extras:"Cap, sunglasses, small umbrella for showers"}; }
  else if(f>=10){ tier="Mild"; lvl=1; L={Top:"Long-sleeve top + light jacket", Bottom:"Jeans or chinos", Feet:"Closed shoes", Head:"Nothing needed"}; }
  else if(f>=0){ tier="Cool & damp"; lvl=2; L={Base:"Light thermal top", Mid:"Fleece or wool sweater", Outer:"Waterproof, windproof shell (hood up)", Legs:"Trousers; thermal leggings if out for hours", Head:"Warm beanie", Hands:"Light waterproof gloves", Feet:"Waterproof boots + wool socks"}; }
  else if(f>=-10){ tier="Cold"; lvl=3; L={Base:"Merino or synthetic thermal top & bottoms (no cotton)", Mid:"Fleece or wool mid-layer", Outer:"Insulated, waterproof winter jacket", Legs:"Thermals + insulated or softshell trousers", Head:"Beanie covering ears + neck warmer", Hands:"Insulated gloves (carry a spare pair)", Feet:"Insulated waterproof boots + thick wool socks"}; }
  else if(f>=-20){ tier="Very cold"; lvl=4; L={Base:"Heavyweight merino thermals, top & bottom", Mid:"Two mid-layers: fleece + down or synthetic vest", Outer:"Down parka with hood", Legs:"Thermals + insulated snow pants", Head:"Thick beanie + balaclava or buff over nose", Hands:"Mittens over liner gloves", Feet:"Arctic boots (rated −30°C) + liner and wool socks"}; }
  else { tier="Extreme cold"; lvl=5; L={Base:"Expedition-weight thermals", Mid:"Fleece + thick down mid-layer", Outer:"Expedition down parka", Legs:"Thermals + down or heavy snow pants", Head:"Balaclava, fur-lined hat, face mask", Hands:"Expedition mittens + liners + hand warmers", Feet:"Arctic boots + toe warmers, two pairs of socks"}; }
  const X=[];
  if(night && lvl>=2) X.push("Standing still while you wait for the aurora is far colder than walking. Add one more mid-layer than you think you need, and bring hand warmers and a thermos.");
  if(wind>=25 && lvl>=2) X.push(`Wind up to ${r0(wind)} km/h${s.gust?` (gusts ${r0(s.gust)})`:""}: windproof outer layers and cover your face.`);
  if(wet && lvl>=1 && lvl<=3) X.push("Wet conditions: waterproof jacket and boots. Umbrellas are no use in coastal wind.");
  if(snow && lvl>=2) X.push("Snow expected: boot gaiters or snow pants keep snow out of your boots.");
  if(icy && lvl>=2) X.push("Temperatures around freezing make icy paths likely. Slip-on ice grips (spikes) are worth wearing.");
  if(!night && lvl>=2) X.push("Low sun on snow is bright. Sunglasses help during the short daylight.");
  if(acts.includes("boat")) X.push("Boat trip: a thermal flotation suit is usually provided. Wear base layers under it and bring a buff and goggles for spray.");
  if(acts.includes("snowmobile")) X.push("Snowmobile: a thermal overall, boots and helmet are usually provided. Wear thermals underneath, and bring a balaclava and mittens: wind chill at speed is harsh.");
  if(acts.includes("husky")) X.push("Husky ride: ski goggles or sunglasses and a face buff for flying snow. Overalls are often provided.");
  if(acts.includes("sleigh")) X.push("Sleigh ride: you sit still for a long time, so wear your warmest socks and a second pair of gloves.");
  if(acts.includes("flight")) X.push("Flight day: easy layers you can take off. The cabin is warm, and the airport doors are not.");
  if(acts.includes("city") && lvl>=2) X.push("City day: you'll go in and out of shops, so choose a jacket that's easy to unzip.");
  if(lvl>=3) X.push("Keep your phone in an inner pocket. Batteries drain fast in the cold.");
  return {tier, lvl, L, X};
}

/* ================= Aurora chance ================= */
function auroraFor(day){
  if(!day.hunt) return null;
  const key = {2:"tro",3:"svo",4:"svo",5:"nar",6:"kan",7:"cab",8:"suo",9:"syo"}[day.n];
  const kp = DATA && DATA.aurora && DATA.aurora.kp ? DATA.aurora.kp[day.date] : null;
  const d = wxFor(key, day.date);
  let hrs = null, cloud=null;
  if(d){
    hrs = []; for(let h=17; h<24; h++) hrs.push({h, c:d.hourly.cloud_cover[h]});
    const nx = wxFor(key, DAYS[day.n] ? DAYS[day.n].date : null);
    if(nx) for(let h=0; h<=2; h++) hrs.push({h, c:nx.hourly.cloud_cover[h]});
    cloud = avg(hrs.map(x=>x.c));
  }
  const act = kp==null ? 0.6 : [0.35,0.5,0.62,0.75,0.88,0.95,1,1,1,1][Math.min(9,kp)];
  const clear = cloud==null ? null : 1 - cloud/100;
  const score = clear==null ? null : Math.max(clear*act, 0);
  const best = hrs && hrs.length ? hrs.reduce((a,b)=> (b.c??101) < (a.c??101) ? b : a) : null;
  let label="Unknown", col="var(--muted)";
  if(score!=null){ if(score>=.55){label="Excellent";col="var(--good)";} else if(score>=.35){label="Good";col="var(--good)";} else if(score>=.18){label="Fair";col="var(--warn)";} else {label="Poor";col="var(--bad)";} }
  return {key, kp, cloud, clear, score, best, hrs, label, col};
}

  if(state.tab==="day") v.innerHTML = dayView(DAYS[state.day]);

  else if(state.tab==="pack") v.innerHTML = packView();
  else v.innerHTML = kitView();
  wire();
}

function dayView(day){
  const t = tripDayIndexNow(), i = day.n-1;
  const rel = t<0 ? `In ${Math.round((new Date(day.date)-new Date(dateIn(TZ.SG)))/864e5)} days` : i===t ? "Today" : i<t ? "Done" : `In ${i-t} day${i-t>1?"s":""}`;
  const cur = [...new Set(day.cc.map(c=>CUR[c]))].join(" → ");
  const tzs = [...new Set(day.cc.map(c=>({SG:"UTC+8",NO:"UTC+1",SE:"UTC+1",FI:"UTC+2",EE:"UTC+2"}[c])))].join(" → ");
  const routeChips = day.title.split("→").map(s=>`<span>${esc(s.trim())}</span>`).join('<span class="arrow">→</span>');
  let html = `<section class="card hero" aria-labelledby="dayTitle">
    <div class="kicker">DAY ${day.n} · ${niceDate(day.date).toUpperCase()}</div>
    <h1 id="dayTitle">${esc(day.title)}</h1>
    <p>${esc(t12(day.blurb))}</p>
    <div class="chips"><span class="tag ${i===t?"gold":""}">${rel}</span>${day.hunt?`<span class="tag aur">${icon("aurora","")} Aurora hunt #${day.hunt}</span>`:""}</div>
    <div class="facts">
      <div class="fact"><div class="k">Sleep</div><div class="v">${esc(day.hotel)}</div></div>
      <div class="fact"><div class="k">Meals included</div><div class="v">${esc(day.meals)}</div></div>
      <div class="fact"><div class="k">Money</div><div class="v">${cur}</div></div>
      <div class="fact"><div class="k">Time zone</div><div class="v">${tzs}</div></div>
    </div>
  </section>`;
  if(day.n===12) html += `<div class="banner">${icon("alert","")}<div><b>Late-night flight.</b> AY131 departs 12:05 am on 3 Dec, which is tonight. Be at Helsinki Airport by about 9:30 pm.</div></div>`;
  if(day.n===6) html += `<div class="banner">${icon("clock","")}<div><b>Clock change.</b> Finland is 1 hour ahead of Norway and Sweden. Move your watch forward when you cross the border.</div></div>`;
  html += weatherCard(day) + wearCard(day);
  if(day.hunt) html += auroraCard(day);
  html += mapCard(day) + planCard(day) + notesCard(day);
  return html;
}

function weatherCard(day){
  const key = state.wxLoc[day.n] || day.wx[0];
  const chips = day.wx.length>1 ? `<div class="chips" role="group" aria-label="Forecast location">${day.wx.map(k=>`<button class="chip" type="button" data-wx="${k}" aria-pressed="${k===key}">${esc(LOCS[k].n)}</button>`).join("")}</div>` : "";
  const d = wxFor(key, day.date);
  let body;
  if(!d){
    body = `<div class="wx-top">${icon("therm","wx-ico")}<div><div class="wx-big">${day.season.lo}° <small>to ${day.season.hi}°C</small></div><div class="wx-cond">Seasonal estimate</div></div></div>
      <p class="sub" style="margin:10px 0 0">${esc(day.season.t)}</p>
      <p class="src">${DATA ? "Live forecasts reach 16 days ahead. This day isn't covered yet, so the itinerary's seasonal range is shown." : "Live forecast not loaded yet. Showing the itinerary's seasonal range."}</p>`;
  } else {
    const isToday = dateIn(d.tz||dayTz(day)) === day.date;
    const nowH = isToday ? +fmt24(d.tz||dayTz(day)).slice(0,2) : null;
    const [a,b] = dayWindow(d); const s = windowStats(d, a, b); const all = windowStats(d,0,23);
    const night = isToday && (nowH < a || nowH > b);
    const H = d.hourly;
    const bigT = isToday ? H.temperature_2m[nowH] : d.temperature_2m_max;
    const bigF = isToday ? H.apparent_temperature[nowH] : s.feelsMin;
    const hum = isToday ? H.relative_humidity_2m[nowH] : all.hum;
    const code = isToday ? H.weather_code[nowH] : d.weather_code;
    const [ic, cond] = wmo(code, night);
    const dl = d.daylight_duration ? d.daylight_duration/3600 : 0;
    const sr = minutes(d.sunrise), ss = minutes(d.sunset);
    body = `<div class="wx-top">${icon(ic,"wx-ico")}<div>
        <div class="wx-big">${r0(bigT)}°<small>C ${isToday?`now · ${h12(nowH)}`:"high"}</small></div>
        <div class="wx-cond">${cond} · <span class="sub">High ${r0(d.temperature_2m_max)}° / Low ${r0(d.temperature_2m_min)}°</span></div></div></div>
      <div class="metrics">
        <div class="metric"><div class="k">Feels like</div><div class="v">${r0(bigF)}°<small>${isToday?"":" min"}</small></div></div>
        <div class="metric"><div class="k">Humidity</div><div class="v">${r0(hum)}<small>%</small></div></div>
        <div class="metric"><div class="k">Wind</div><div class="v">${r0(isToday?H.wind_speed_10m[nowH]:d.wind_speed_10m_max)}<small> km/h</small></div></div>
        <div class="metric"><div class="k">Precip.</div><div class="v">${r0(d.precipitation_probability_max)}<small>%</small></div></div>
      </div>
      <div class="chart" aria-label="Hourly temperature and feels-like chart">${hourlyChart(d, nowH)}</div>
      <div class="daylight">
        <div class="dl-bar" title="Daylight">${sr!=null&&ss!=null&&ss>sr?`<span style="left:${sr/14.4}%;width:${(ss-sr)/14.4}%"></span>`:""}</div>
        <div class="dl-meta"><span>Sunrise <b class="mono">${d.sunrise?t12(d.sunrise):"none"}</b></span><span><b>${dl? `${Math.floor(dl)} h ${Math.round(dl%1*60)} min` : "Polar night"}</b> of daylight</span><span>Sunset <b class="mono">${d.sunset?t12(d.sunset):"none"}</b></span></div>
      </div>
      <p class="src">Forecast for ${esc(LOCS[key].n)} (local time) · Open-Meteo, updated ${esc(DATA.updated.replace("T"," ").replace("Z"," UTC"))}${dataFromCache?" (saved copy, offline)":""}. Forecasts more than a week out can change a lot.</p>`;
  }
  return `<section class="card"><div class="sec-head"><h2>${icon("therm")} Weather</h2>${chips}</div>${body}</section>`;
}

function hourlyChart(d, nowH){
  const H=d.hourly, W=600, Ht=190, padL=30, padR=10, padT=14, padB=46;
  const T=H.temperature_2m, F=H.apparent_temperature, P=H.precipitation_probability;
  const vals=[...T,...F].filter(v=>v!=null); if(!vals.length) return "";
  let lo=Math.floor(Math.min(...vals)/2)*2-2, hi=Math.ceil(Math.max(...vals)/2)*2+2; if(hi-lo<8){hi+=2;lo-=2;}
  const x=h=>padL+(W-padL-padR)*h/23, y=v=>padT+(Ht-padT-padB)*(hi-v)/(hi-lo);
  const sr=minutes(d.sunrise), ss=minutes(d.sunset);
  let s=`<svg viewBox="0 0 ${W} ${Ht}" role="img"><title>Hourly temperature (solid) and feels-like (dashed)</title>`;
  // night shading
  const nightRect=(a,b)=>`<rect x="${x(a)}" y="${padT}" width="${Math.max(0,x(b)-x(a))}" height="${Ht-padT-padB}" fill="var(--sky2)" opacity=".16"/>`;
  if(sr==null||ss==null) s+=nightRect(0,23); else { s+=nightRect(0,sr/60); s+=nightRect(ss/60,23); }
  // grid
  const step = (hi-lo)>16?4:2;
  for(let v=lo; v<=hi; v+=step){ s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="JetBrains Mono,monospace">${v}°</text>`; }
  if(lo<0&&hi>0) s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--aurora2)" stroke-width="1.2" stroke-dasharray="2 3" opacity=".7"/>`;
  // precip prob bars
  const by=Ht-padB+8, bh=18;
  P.forEach((p,h)=>{ if(p!=null&&p>0) s+=`<rect x="${x(h)-7}" y="${by+bh-bh*p/100}" width="14" height="${bh*p/100}" rx="2" fill="var(--aurora2)" opacity=".45"/>`; });
  // lines
  const path=A=>A.map((v,h)=>v==null?"":`${h&&A[h-1]!=null?"L":"M"}${x(h).toFixed(1)},${y(v).toFixed(1)}`).join("");
  s+=`<path d="${path(T)}" fill="none" stroke="var(--berry)" stroke-width="2.6" stroke-linejoin="round"/>`;
  s+=`<path d="${path(F)}" fill="none" stroke="var(--aurora2)" stroke-width="2.2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  if(nowH!=null){ s+=`<line x1="${x(nowH)}" x2="${x(nowH)}" y1="${padT}" y2="${Ht-padB}" stroke="var(--gold)" stroke-width="1.5"/><circle cx="${x(nowH)}" cy="${y(T[nowH])}" r="4.5" fill="var(--berry)" stroke="var(--card)" stroke-width="2"/>`; }
  for(let h=0;h<24;h+=3) s+=`<text x="${x(h)}" y="${Ht-4}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="JetBrains Mono,monospace">${h12(h)}</text>`;
  s+=`<text x="${W-padR}" y="${padT-3}" text-anchor="end" font-size="11" fill="var(--muted)"><tspan fill="var(--berry)">━</tspan> temp  <tspan fill="var(--aurora2)">╍</tspan> feels like  <tspan fill="var(--aurora2)" opacity=".6">▮</tspan> chance of precip.  shaded = dark</text>`;
  return s+"</svg>";
}

function wearCard(day){
  const key = state.wxLoc[day.n] || day.wx[0];
  const d = wxFor(key, day.date);
  let s, src;
  if(d){
    const [a,b]=dayWindow(d);
    s = state.wearMode==="night" ? windowStats(d,18,23) : windowStats(d,a,b);
    src = `${state.wearMode==="night"?"6pm–11pm":`${h12(a)}–${h12(b)}`} in ${LOCS[key].n}: feels like ${r0(s.feelsMin)}° to ${r0(s.feelsMax)}°C`;
  } else {
    const lo = day.season.lo - (state.wearMode==="night"?4:0);
    s = {feelsMin: lo-3, feelsMax: day.season.hi, tMin: lo, tMax: day.season.hi, wind:0, pop:0, snow:0, wet:/rain|wet|sleet|shower/i.test(day.season.t), snowy:/snow/i.test(day.season.t)};
    src = `Based on the seasonal range (${day.season.lo}° to ${day.season.hi}°C), allowing for wind chill`;
  }
  const w = wearAdvice(s, day.acts, state.wearMode==="night");
  const toggle = day.hunt || day.acts.includes("night") ? `<div class="chips" role="group" aria-label="Time of day"><button class="chip" type="button" data-wear="day" aria-pressed="${state.wearMode==="day"}">Daytime</button><button class="chip" type="button" data-wear="night" aria-pressed="${state.wearMode==="night"}">Aurora night</button></div>` : "";
  const th = [0,1,2,3,4,5].map(i=>`<i style="background:${i<=w.lvl?["#FFB65C","#FFD27A","#9BE7FF","#7CC4FF","#8C9BFF","#C49BFF"][i]:"var(--line)"}"></i>`).join("");
  return `<section class="card"><div class="sec-head"><h2>${icon("shirt")} What to wear</h2>${toggle}</div>
    <div class="wear-head"><span class="tier">${w.tier}</span><span class="thermo" aria-hidden="true">${th}</span><span class="sub">${esc(src)}</span></div>
    <div class="layers">${Object.entries(w.L).map(([z,t])=>`<div class="layer"><div class="z">${z}</div><div class="w">${esc(t)}</div></div>`).join("")}</div>
    ${w.X.length?`<div class="extras">${w.X.map(x=>`<div class="extra">${esc(x)}</div>`).join("")}</div>`:""}
  </section>`;
}

function auroraCard(day){
  const a = auroraFor(day);
  const pct = a.score==null ? 0 : Math.min(1, a.score/0.75);
  const C = 2*Math.PI*48;
  const gauge = `<div class="gauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="60" cy="60" r="48" fill="none" stroke="${a.col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 60 60)"/></svg><div class="g-txt"><b style="color:${a.col}">${a.label}</b><span>tonight</span></div></div>`;
  const kpTxt = a.kp==null ? "–" : a.kp;
  const hours = a.hrs ? `<div class="hours" aria-label="Cloud cover by hour">${a.hrs.map(x=>{const c=x.c??100; return `<div class="hr"><i style="background:color-mix(in srgb,var(--sky1) ${Math.round(100-c)}%,#B9C6DA ${Math.round(c)}%)" title="${c}% cloud"></i>${h12(x.h)}</div>`;}).join("")}</div><p class="src" style="margin-top:4px">Dark tiles = clear sky, pale tiles = cloud. ${a.best?`Clearest hour: <b>${h12(a.best.h)}</b> (${a.best.c}% cloud).`:""}</p>` : "";
  return `<section class="card"><div class="sec-head"><h2>${icon("aurora")} Aurora outlook · hunt #${day.hunt}</h2><span class="sub">near ${esc(LOCS[a.key].n)}</span></div>
    <div class="aur-grid">${gauge}
      <div class="bars">
        <div class="bar-row"><div class="lbl">Solar activity (Kp) <span>${kpTxt} of 9</span></div><div class="track"><span style="width:${a.kp==null?0:a.kp/9*100}%"></span></div></div>
        <div class="bar-row"><div class="lbl">Clear sky 5pm–2am <span>${a.clear==null?"–":Math.round(a.clear*100)+"%"}</span></div><div class="track"><span style="width:${a.clear==null?0:a.clear*100}%"></span></div></div>
        <p class="sub" style="margin:0">At about 66–70°N you are under the auroral oval, so even Kp 2–3 can light up the sky. Clouds matter more than Kp. Best viewing is usually 9pm–1am.</p>
      </div></div>${hours}
    <p class="src">Kp: NOAA SWPC 27-day outlook (issued ${esc(DATA&&DATA.aurora&&DATA.aurora.issued||"–")}); long-range Kp is a rough guide. Check again on the day, and remember sightings are never guaranteed.</p>
  </section>`;
}

  let cd = "";
  if(next){ const ms = when(next)-now, dd=Math.floor(ms/864e5), hh=Math.floor(ms%864e5/36e5), mm=Math.floor(ms%36e5/6e4);
    cd = `<section class="card"><div class="sub">Next flight · ${next.no} ${next.from} → ${next.to}</div><div class="count mono">${dd>0?dd+"d ":""}${hh}h ${mm}m</div><div class="sub">Departs ${niceDate(next.d)} at ${t12(next.dep)} local time</div></section>`; }
  const plane = '<svg viewBox="0 0 56 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 10h52" stroke-dasharray="3 3"/><path d="M30 10l-4-6h2.5l6 6-6 6H26l4-6Z" fill="currentColor" stroke="none"/></svg>';
  const rows = FLIGHTS.map(f=>`<div class="pass">
      <div><div class="ap">${f.from}</div><div class="city">${f.fc}</div><div class="tm">${t12(f.dep)}</div></div>
      <div class="mid">${f.dur}${plane}${f.no}</div>
      <div class="r"><div class="ap">${f.to}</div><div class="city">${f.tc}</div><div class="tm">${t12(f.arr)}${f.plus?" <small>+1</small>":""}</div></div>
      <div class="flt-meta"><span class="tag">${niceDate(f.d)}</span><span class="sub">Finnair · local times</span></div></div>`).join("");
  return cd + `<section class="card"><div class="sec-head"><h2>${icon("clock")} Flights</h2><span class="sub">Times as printed; confirm in the Finnair app</span></div>${rows}</section>

 ["Head, hands & feet",["Beanie covering ears","Neck warmer or buff","Balaclava","Liner gloves","Insulated gloves or mittens","Spare gloves","Insulated waterproof boots","Wool socks ×5","Ice grips / shoe spikes"]],

function kitView(){

      ${[["Hello","Hei","Hej","Moi / Hei"],["Thank you","Takk","Tack","Kiitos"],["Please","Vær så snill","Snälla","Ole hyvä"],["Excuse me","Unnskyld","Ursäkta","Anteeksi"],["How much?","Hvor mye?","Hur mycket?","Paljonko?"],["Cheers!","Skål!","Skål!","Kippis!"],["Northern lights","Nordlys","Norrsken","Revontulet"],["Toilet","Toalett","Toalett","Vessa"],["Goodbye","Ha det","Hej då","Näkemiin"]].map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<td><b>${c}</b></td>`).join("")}</tr>`).join("")}

/* ================= Wiring ================= */
function wire(){
  document.querySelectorAll("[data-wx]").forEach(b=>b.onclick=()=>{ state.wxLoc[state.day+1]=b.dataset.wx; render(); });
  document.querySelectorAll("[data-wear]").forEach(b=>b.onclick=()=>{ state.wearMode=b.dataset.wear; render(); });
  const note=$("#note"); if(note){ let tm; note.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ store.set("lap.note."+note.dataset.n, note.value); $("#saved").textContent="Saved"; },400); }; }
  document.querySelectorAll(".pk input").forEach(cb=>cb.onchange=()=>{ const d=store.get("lap.pack",{}); if(cb.checked) d[cb.dataset.k]=1; else delete d[cb.dataset.k]; store.set("lap.pack",d); const y=window.scrollY; render(); window.scrollTo(0,y); });
  const amt=$("#amt"), cur=$("#cur");
  if(amt){ const upd=()=>{ const fx=(DATA&&DATA.fx)||FX_FALLBACK; const v=parseFloat(amt.value)||0; $("#convOut").textContent=`${v.toLocaleString("en-GB")} ${cur.value} ≈ SGD ${(v/fx.perSGD[cur.value]).toLocaleString("en-GB",{maximumFractionDigits:2,minimumFractionDigits:2})}`; store.set("lap.amt",v); store.set("lap.cur",cur.value); }; amt.oninput=upd; cur.onchange=upd; upd(); }
  if($("#mapCv")) initMap(DAYS[state.day]);
}

/* ================= Map (canvas, offline outlines) ================= */
let mapState=null;
function initMap(day){
  const cv=$("#mapCv"), box=$("#mapbox"), ctx=cv.getContext("2d");
  const world = day.map==="world";
  const focus = day.stops.filter(s=>!s.far).map(s=>s.ll);
  const lat0 = world ? 35 : avg(focus.map(p=>p[0]));
  const kx = Math.cos(lat0*Math.PI/180);
  const P = ([la,lo]) => [lo*kx, -la];             // projected units
  const fit = () => {
    const pts = (world? day.stops.map(s=>s.ll) : focus).map(P);
    let x0=Math.min(...pts.map(p=>p[0])), x1=Math.max(...pts.map(p=>p[0])), y0=Math.min(...pts.map(p=>p[1])), y1=Math.max(...pts.map(p=>p[1]));
    const minSpan = world?40:0.08; if(x1-x0<minSpan){const c=(x0+x1)/2;x0=c-minSpan/2;x1=c+minSpan/2;} if(y1-y0<minSpan*.7){const c=(y0+y1)/2;y0=c-minSpan*.35;y1=c+minSpan*.35;}
    const W=box.clientWidth, H=box.clientHeight, pad=46;
    const sc=Math.min((W-pad*2)/(x1-x0),(H-pad*2)/(y1-y0));
    return {sc, cx:(x0+x1)/2, cy:(y0+y1)/2};
  };
  const ms = mapState = Object.assign(fit(), {day:day.n});
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function draw(){
    const W=box.clientWidth, H=box.clientHeight, dpr=Math.min(2,window.devicePixelRatio||1);
    if(cv.width!==Math.round(W*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const S = ll => { const [x,y]=P(ll); return [(x-ms.cx)*ms.sc+W/2, (y-ms.cy)*ms.sc+H/2]; };
    ctx.fillStyle=css("--water"); ctx.fillRect(0,0,W,H);
    // graticule
    ctx.strokeStyle=css("--line"); ctx.globalAlpha=.35; ctx.lineWidth=1;
    const gstep = world?10:(ms.sc>2000?0.5:ms.sc>300?1:5);
    for(let la=-10; la<=80; la+=gstep){ const a=S([la,-30]), b=S([la,140]); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
    for(let lo=-30; lo<=140; lo+=gstep){ const a=S([-10,lo]), b=S([80,lo]); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
    ctx.globalAlpha=1;
    // Arctic Circle
    if(!world){ ctx.setLineDash([6,5]); ctx.strokeStyle=css("--aurora2"); ctx.globalAlpha=.6; const a=S([66.5633,0]), b=S([66.5633,40]); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
      const lp=S([66.5633, (ms.cx+ (W/2-60)/ms.sc)/kx]); ctx.font="600 10.5px Nunito Sans, sans-serif"; ctx.fillStyle=css("--aurora2"); ctx.textAlign="right"; ctx.fillText("Arctic Circle 66°33′N", Math.min(W-10,lp[0]+50), lp[1]-5); }
    // land
    if(MAP){
      const set = world? MAP.world : MAP.nordic;
      ctx.fillStyle=css("--land"); ctx.strokeStyle=css("--land-line"); ctx.lineWidth=world?.8:1; ctx.lineJoin="round";
      for(const c of set){ ctx.beginPath(); for(const r of c.r){ for(let i=0;i<r.length;i+=2){ const p=S([r[i+1],r[i]]); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); } ctx.closePath(); } ctx.fill("evenodd"); ctx.stroke(); }
      // country names
      const names = world? [["Finland",62.5,26],["Singapore",1.3,103.8],["India",22,79],["China",34,102],["Russia",60,60]] : [["NORWAY",64.2,12.6],["SWEDEN",66.2,19.0],["FINLAND",65.0,27.5],["ESTONIA",58.8,25.6],["RUSSIA",67.6,31.8]];
      ctx.font=`800 ${world?11:12}px Nunito Sans, sans-serif`; ctx.fillStyle=css("--muted"); ctx.globalAlpha=.75; ctx.textAlign="center";
      for(const [n,la,lo] of names){ const p=S([la,lo]); if(p[0]>-50&&p[0]<W+50&&p[1]>-20&&p[1]<H+20) ctx.fillText(n.split("").join(String.fromCharCode(8202)),p[0],p[1]); }
      ctx.globalAlpha=1;
    }
    // routes
    for(const r of day.routes){
      const pts = r.t==="flight" ? arc(r.pts[0], r.pts[1]) : r.pts;
      ctx.lineWidth = r.t==="flight"?2.4:3.4; ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.strokeStyle = css({road:"--route",train:"--rail",flight:"--flight",ferry:"--aurora"}[r.t]);
      ctx.setLineDash(r.t==="flight"?[8,6]:r.t==="ferry"?[2,6]:r.t==="train"?[12,4]:[]);
      ctx.beginPath(); pts.forEach((ll,i)=>{ const p=S(ll); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }); ctx.stroke(); ctx.setLineDash([]);
    }
    // markers
    let n=0; const placed=[];
    ctx.textAlign="left";
    for(const s of day.stops){
      const [x,y]=S(s.ll); const lab = s.k==="h"?"H":s.k==="a"?"✈":String(++n);
      if(x<-20||x>W+20||y<-20||y>H+20) continue;
      const dup = placed.find(p=>Math.hypot(p[0]-x,p[1]-y)<6); if(dup) continue; placed.push([x,y]);
      ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fillStyle=css(s.k==="h"?"--gold":s.k==="a"?"--flight":"--route"); ctx.fill();
      ctx.lineWidth=2.5; ctx.strokeStyle=css("--card"); ctx.stroke();
      ctx.fillStyle = s.k==="s" ? "#fff" : "#08162B"; ctx.font="800 11px Nunito Sans, sans-serif"; ctx.textAlign="center"; ctx.fillText(lab,x,y+4);
      ctx.textAlign="left"; ctx.font="700 12px Nunito Sans, sans-serif";
      const name = s.n.replace(/ \(.+\)$/,""); const tw=ctx.measureText(name).width; const lx = x+14+tw>W-6 ? x-14-tw : x+14;
      ctx.lineWidth=4; ctx.strokeStyle=css("--water"); ctx.strokeText(name,lx,y+4); ctx.fillStyle=css("--fg"); ctx.fillText(name,lx,y+4);
    }
    // scale hint
    ctx.font="600 10.5px Nunito Sans, sans-serif"; ctx.fillStyle=css("--muted"); ctx.textAlign="left";
    const kmPerPx = 111.32/ms.sc*(1/1); const cand=[1,2,5,10,20,50,100,200,500,1000,2000]; const km=cand.find(c=>c/kmPerPx>60)||2000; const px=km/kmPerPx;
    ctx.fillRect(10,H-14,px,3); ctx.fillText(km+" km",10,H-19);
  }
  function arc(a,b){ const out=[]; for(let i=0;i<=40;i++){ const t=i/40; const la=a[0]+(b[0]-a[0])*t, lo=a[1]+(b[1]-a[1])*t; const bump=Math.sin(Math.PI*t)*Math.min(14,Math.hypot(b[0]-a[0],(b[1]-a[1])*kx)*.18); out.push([la+bump,lo]); } return out; }
  // interaction
  const zoomAt=(f,px,py)=>{ const W=box.clientWidth,H=box.clientHeight; const wx=(px-W/2)/ms.sc+ms.cx, wy=(py-H/2)/ms.sc+ms.cy; ms.sc=Math.max(world?1:20,Math.min(world?60:40000,ms.sc*f)); ms.cx=wx-(px-W/2)/ms.sc; ms.cy=wy-(py-H/2)/ms.sc; draw(); };
  $("#zIn").onclick=()=>zoomAt(1.6,box.clientWidth/2,box.clientHeight/2);
  $("#zOut").onclick=()=>zoomAt(1/1.6,box.clientWidth/2,box.clientHeight/2);
  $("#zFit").onclick=()=>{ Object.assign(ms,fit()); draw(); };
  cv.onwheel=e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top); };
  const ptrs=new Map(); let lastDist=0;
  cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]); };
  cv.onpointermove=e=>{ if(!ptrs.has(e.pointerId)) return; const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===1){ ms.cx-=(e.clientX-prev[0])/ms.sc; ms.cy-=(e.clientY-prev[1])/ms.sc; draw(); }
    else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); const r=cv.getBoundingClientRect(); if(lastDist) zoomAt(d/lastDist,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top); lastDist=d; } };
  cv.onpointerup=cv.onpointercancel=e=>{ ptrs.delete(e.pointerId); lastDist=0; };
  ms.draw=draw;
  draw();
}
window.addEventListener("resize",()=>{ if(mapState&&mapState.draw&&$("#mapCv")) mapState.draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());

/* ================= Sky: aurora ribbons + snow + string lights ================= */
(function sky(){
  const cv=$("#auroraCv"), ctx=cv.getContext("2d"), host=$("#sky");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0, flakes=[], stars=[];
  function size(){ const dpr=Math.min(2,devicePixelRatio||1); W=host.clientWidth; H=host.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.round(W/9)},()=>[Math.random()*W,Math.random()*H*.8,Math.random()*1.1+.3,Math.random()*6]);
    flakes=Array.from({length:Math.round(W/22)},()=>[Math.random()*W,Math.random()*H,Math.random()*1.6+.6,Math.random()*.4+.2]); }
  function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=.35+.35*Math.sin(t/900+s[3]); ctx.fillStyle="#fff"; ctx.fillRect(s[0],s[1],s[2],s[2]); }
    const bands=[["125,245,195",.34,0],["134,217,255",.22,2.1],["197,168,255",.16,4.2]];
    for(const [rgb,al,ph] of bands){
      for(let x=0;x<W;x+=3){
        const y = H*.42 + Math.sin(x/170 + t/4200 + ph)*H*.16 + Math.sin(x/61 + t/2600 + ph)*H*.05;
        const h = H*(.35+.18*Math.sin(x/95 + t/3100 + ph));
        const g=ctx.createLinearGradient(0,y-h,0,y+8);
        g.addColorStop(0,`rgba(${rgb},0)`); g.addColorStop(.75,`rgba(${rgb},${al*(.55+.45*Math.sin(x/40+t/1500+ph))})`); g.addColorStop(1,`rgba(${rgb},0)`);
        ctx.globalAlpha=1; ctx.fillStyle=g; ctx.fillRect(x,y-h,3,h+8);
      }
    }
    ctx.fillStyle="#fff";
    for(const f of flakes){ ctx.globalAlpha=.75; ctx.beginPath(); ctx.arc(f[0],f[1],f[2],0,7); ctx.fill(); if(!reduce){ f[1]+=f[3]; f[0]+=Math.sin(t/1400+f[1]/30)*.25; if(f[1]>H+4){f[1]=-4;f[0]=Math.random()*W;} } }
    ctx.globalAlpha=1;
    if(!reduce) requestAnimationFrame(frame);
  }
  size(); new ResizeObserver(size).observe(host);
  requestAnimationFrame(frame);
  // festive string lights
  const L=$("#lights"), cols=["#FF7484","#FFC95E","#7DF5C3","#86D9FF","#C5A8FF"];
  L.innerHTML = Array.from({length:22},(_,i)=>`<i style="left:${(i+.5)/22*100}%;color:${cols[i%5]};background:${cols[i%5]};opacity:.9"></i>`).join("");
  if(!reduce) setInterval(()=>L.querySelectorAll("i").forEach(el=>el.style.opacity = Math.random()>.25?".95":".35"), 900);
})();

window.addEventListener("hashchange", route);
setInterval(()=>renderHeader(false), 30000);
route(); boot();
